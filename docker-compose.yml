version: '3.8'

services:
  web:
    build: .
    container_name: reservation-web
    ports:
      - "80:80"
    environment:
      - DB_HOST=db
      - DB_NAME=ReservationSystem
      - DB_USER=app_user
      - DB_PASS=app_password
      - APP_DEBUG=true
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: reservation-db
    restart: always
    environment:
      - MYSQL_DATABASE=ReservationSystem
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_password
      - MYSQL_ROOT_PASSWORD=root_secret
    volumes:
      - db_data:/var/lib/mysql
      - ./bd.sql:/docker-entrypoint-initdb.d/init.sql
    platform: linux/x86_64

volumes:
  db_data:
